name: CPU ISA probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'include/hypercine/cpu_isa.h'
      - 'src/cpu/cpu_isa.cpp'
      - 'tests/test_cpu_isa.cpp'
      - 'tests/cpu_isa_probe/CMakeLists.txt'
      - '.github/workflows/cpu-isa-probe.yml'
  push:
    branches: [main]
    paths:
      - 'include/hypercine/cpu_isa.h'
      - 'src/cpu/cpu_isa.cpp'
      - 'tests/test_cpu_isa.cpp'
      - 'tests/cpu_isa_probe/CMakeLists.txt'
      - '.github/workflows/cpu-isa-probe.yml'

permissions:
  contents: read

jobs:
  isa:
    name: ISA probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure native MSVC x64
        if: runner.os == 'Windows'
        run: cmake -S tests/cpu_isa_probe -B build-cpu-isa -G "Visual Studio 17 2022" -A x64
      - name: Configure native C++17
        if: runner.os != 'Windows'
        run: cmake -S tests/cpu_isa_probe -B build-cpu-isa -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-cpu-isa --config Release --parallel 2
      - name: Native fail-closed tests
        run: ctest --test-dir build-cpu-isa -C Release --output-on-failure
