name: Portable quality state

on:
  push:
    paths:
      - 'include/hypercine/quality_state.h'
      - 'src/core/quality_state.cpp'
      - 'tests/quality_state*'
      - 'tests/validate_quality_state_corpus.py'
      - 'include/hypercine/phase2d.h'
      - 'src/CMakeLists.txt'
      - 'tests/test_quality_state.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/quality-state.yml'
  pull_request:
    paths:
      - 'include/hypercine/quality_state.h'
      - 'src/core/quality_state.cpp'
      - 'tests/quality_state*'
      - 'tests/validate_quality_state_corpus.py'
      - 'include/hypercine/phase2d.h'
      - 'src/CMakeLists.txt'
      - 'tests/test_quality_state.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/quality-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-state:
    name: Quality state (${{ matrix.name }})
    # Routing only; see docs/SELF_HOSTED_CI_TRANSITION.md.
    # Fork pull requests never reach the pool; see standalone workflow comment.
    runs-on: ${{ fromJSON(vars.HYPERCINE_CI_SELF_HOSTED == '1' && github.event.pull_request.head.repo.fork != true && format('["self-hosted","{0}"]', matrix.capability) || format('"{0}"', matrix.runner)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            capability: hc-macos-arm64
            osx_arch: arm64
          - name: Windows MSVC x64
            runner: windows-2022
            capability: hc-windows-x64-msvc
            osx_arch: ''
          - name: Linux x64
            runner: ubuntu-24.04
            capability: hc-linux-x64-cpu
            osx_arch: ''
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable calculator only
        shell: bash
        run: |
          flags=()
          if [[ "${{ matrix.osx_arch }}" != "" ]]; then flags+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}); fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            flags+=("-DCMAKE_CXX_FLAGS=-fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all"
                    "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined,float-cast-overflow")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DHYPERCINE_BUILD_QUALITY_STATE_ONLY=ON "${flags[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
