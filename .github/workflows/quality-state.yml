name: Portable quality state

on:
  push:
    branches: ['main']
    tags: ['**']
    paths:
      - 'include/hypercine/quality_state.h'
      - 'src/core/quality_state.cpp'
      - 'tests/quality_state*'
      - 'tests/validate_quality_state_corpus.py'
      - 'include/hypercine/phase2d.h'
      - 'src/CMakeLists.txt'
      - 'tests/test_quality_state.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/quality-state.yml'
      - 'ci/run_macos_lane.py'
  pull_request:
    paths:
      - 'include/hypercine/quality_state.h'
      - 'src/core/quality_state.cpp'
      - 'tests/quality_state*'
      - 'tests/validate_quality_state_corpus.py'
      - 'include/hypercine/phase2d.h'
      - 'src/CMakeLists.txt'
      - 'tests/test_quality_state.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/quality-state.yml'
      - 'ci/run_macos_lane.py'
  workflow_dispatch:
    inputs:
      mac_hosted_fallback:
        description: 'Explicit owner approval for paid Mac fallback on this exact commit'
        type: boolean
        default: false
      mac_candidate_sha:
        description: 'Exact selected ref commit SHA; must equal github.sha'
        type: string
        default: ''

# Cancel superseded PR heads; preserve unique main/tag/manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-state:
    name: Quality state (${{ matrix.name }})
    # Windows/Linux remain hosted on every existing event. Mac is owner-only manual fallback.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.actor_id == '248477380' && github.triggering_actor == 'louis-0hrs' && inputs.mac_hosted_fallback == true && inputs.mac_candidate_sha == github.sha && '[{"name":"macOS arm64","runner":"macos-15","capability":"hc-macos-arm64","osx_arch":"arm64"},{"name":"Windows MSVC x64","runner":"windows-2022","capability":"hc-windows-x64-msvc","osx_arch":""},{"name":"Linux x64","runner":"ubuntu-24.04","capability":"hc-linux-x64-cpu","osx_arch":""}]' || '[{"name":"Windows MSVC x64","runner":"windows-2022","capability":"hc-windows-x64-msvc","osx_arch":""},{"name":"Linux x64","runner":"ubuntu-24.04","capability":"hc-linux-x64-cpu","osx_arch":""}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Native Mac lane
        if: runner.os == 'macOS'
        run: python3 ci/run_macos_lane.py --lane quality-state
      - name: Configure portable calculator only
        if: runner.os != 'macOS'
        shell: bash
        run: |
          flags=()
          if [[ "${{ matrix.osx_arch }}" != "" ]]; then flags+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}); fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            flags+=("-DCMAKE_CXX_FLAGS=-fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all"
                    "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined,float-cast-overflow")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DHYPERCINE_BUILD_QUALITY_STATE_ONLY=ON "${flags[@]}"
      - name: Build
        if: runner.os != 'macOS'
        run: cmake --build build --config Release --parallel 3
      - name: CTest
        if: runner.os != 'macOS'
        run: ctest --test-dir build -C Release --output-on-failure
