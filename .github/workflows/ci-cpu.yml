name: CPU Reference CI

# Cancel superseded runs per PR number (or push ref), not the required check
# of another event type. Distinct fork PRs cannot cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:

jobs:
  cpu-only-windows-msvc:
    name: Windows MSVC (CPU-Only Build & Tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify upstream immutability
        shell: pwsh
        run: python ci/check_upstream_immutable.py

      - name: Configure CMake (CPU-Only)
        shell: pwsh
        run: cmake -B build-cpu -S . -DHYPERCINE_ENABLE_CUDA=OFF

      - name: Build Release
        shell: pwsh
        run: python ci/ci_performance.py measure --output build-cpu/ci-build-timing.json --label reference-build -- cmake --build build-cpu --config Release --parallel 3

      - name: Run CPU CTest Suite
        shell: pwsh
        run: python ci/ci_performance.py measure --output build-cpu/ci-test-timing.json --label reference-tests --junit build-cpu/reference-results.xml -- ctest --test-dir build-cpu -C Release --output-on-failure --no-tests=error --output-junit "$PWD/build-cpu/reference-results.xml"

      - name: Preserve CPU timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-cpu-timing
          retention-days: 7
          path: |
            build-cpu/ci-*-timing.json
            build-cpu/reference-results.xml
