name: CPU Reference CI

# Cancel superseded runs per PR number (or push ref), not the required check
# of another event type. Distinct fork PRs cannot cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "**" ]
    tags: [ "*" ]
  pull_request:

jobs:
  cpu-only-windows-msvc:
    name: Windows MSVC (CPU-Only Build & Tests)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify upstream immutability
        shell: pwsh
        run: |
          $status = git status --porcelain upstream/
          if ($status) {
            Write-Error "upstream/ directory has been modified: $status"
            exit 1
          }

      - name: Configure CMake (CPU-Only)
        shell: pwsh
        run: cmake -B build-cpu -S . -DHYPERCINE_ENABLE_CUDA=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build build-cpu --config Release

      - name: Run CPU CTest Suite
        shell: pwsh
        run: ctest --test-dir build-cpu -C Release --output-on-failure
